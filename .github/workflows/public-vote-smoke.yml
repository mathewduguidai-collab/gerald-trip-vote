name: Verify Gerald public voting page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Guard HTML structure and JavaScript syntax BEFORE deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path('index.html')
          raw=p.read_text(encoding='utf-8')
          assert raw.count('<script>') == 1, 'expected one script'
          assert raw.count('</script>') == 1, 'script closed prematurely or duplicated'
          assert raw.count('</body>') == 1, 'body end duplicated'
          assert raw.count('</html>') == 1, 'HTML end duplicated'
          assert raw.strip().endswith('</html>'), 'unexpected page text after HTML'
          assert 'Google Maps' in raw and "const BASE=" in raw
          js=raw.split('<script>',1)[1].split('</script>',1)[0]
          assert len(js)>1500
          Path('/tmp/gerald-vote-check.js').write_text(js)
          class VisibleText(HTMLParser):
              inside_script=False
              visible=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':self.inside_script=True
              def handle_endtag(self,tag):
                  if tag=='script':self.inside_script=False
              def handle_data(self,data):
                  if not self.inside_script:self.visible.append(data)
          parsed=VisibleText()
          parsed.feed(raw)
          visible=' '.join(parsed.visible)
          assert 'card.append(form)' not in visible, 'JavaScript leaked into visible page'
          print('PASS: one complete HTML document, no visible script leakage')
          PY
          node --check /tmp/gerald-vote-check.js
          echo 'PASS: frontend JavaScript parses without syntax errors'
      - name: Check actual public Pages HTML
        shell: bash
        run: |
          set -euo pipefail
          site='https://mathewduguidai-collab.github.io/gerald-trip-vote/'
          curl -fsSL --max-time 20 --retry 2 --retry-delay 5 "$site" -o /tmp/page.html
          grep -q 'Gerald Trip Decisions' /tmp/page.html
          grep -q "const BASE=" /tmp/page.html
          ! grep -q 'SUPABASE_DB_URL' /tmp/page.html
          echo 'PASS: published HTML is voting UI without private DB credential'
      - name: Check HTTPS backend and allowed browser origin
        shell: bash
        run: |
          set -euo pipefail
          api='https://splsniqrunknnwhccrxo.supabase.co/functions/v1/gerald-trip-vote'
          curl -fsSL --max-time 15 "$api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status')=='ok',data
          print('PASS: backend health')
          PY
          curl -sS --max-time 15 -D /tmp/preflight.txt -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://mathewduguidai-collab.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            "$api/ballot"
          grep -q '204' /tmp/preflight.txt
          grep -qi 'access-control-allow-origin: https://mathewduguidai-collab.github.io' /tmp/preflight.txt
          echo 'PASS: CORS preflight from GitHub Pages origin'
