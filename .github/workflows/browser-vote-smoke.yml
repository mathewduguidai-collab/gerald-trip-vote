name: Browser acceptance for voting
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/browser-flow.mjs'
      - '.github/workflows/browser-vote-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Playwright for isolated browser testing
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Exercise phone-sized voting flow with mocked API (no real votes)
        run: node tests/browser-flow.mjs
